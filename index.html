<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>벽돌깨기</title>
<style>
  :root { --bg:#0f1220; --panel:#1a1f36; --text:#e8ecff; --muted:#8a93b8; --accent:#5b8cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; touch-action:none; }
  h1 { margin:0; font-size:1.5rem; letter-spacing:.05em; }
  #hud { display:flex; gap:20px; font-variant-numeric:tabular-nums; color:var(--muted); }
  #hud b { color:var(--text); }
  #wrap { position:relative; width:100%; max-width:640px; }
  canvas { display:block; width:100%; height:auto; background:var(--panel); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:rgba(15,18,32,.75); border-radius:12px; text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  #overlay h2 { margin:0; font-size:1.8rem; }
  #overlay p { margin:0; color:var(--muted); }
  button { font:inherit; font-weight:600; padding:10px 24px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .help { color:var(--muted); font-size:.85rem; text-align:center; }
</style>
</head>
<body>
  <h1>🧱 벽돌깨기</h1>
  <div id="hud">
    <span>점수 <b id="score">0</b></span>
    <span>최고 <b id="best">0</b></span>
    <span>레벨 <b id="level">1</b></span>
    <span>생명 <b id="lives">3</b></span>
  </div>
  <div id="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">벽돌깨기</h2>
      <p id="ovText">공을 튕겨서 모든 벽돌을 깨세요!</p>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div class="help">← → / 마우스 / 터치로 이동 · Space로 발사 · P로 일시정지</div>

<script>
(() => {
  const W = 640, H = 480;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), startBtn = $('startBtn');

  const COLORS = ['#ff5d73', '#ff9f43', '#ffd166', '#06d6a0', '#4cc9f0', '#9b5de5'];
  const COLS = 10, BW = 56, BH = 20, GAP = 6, TOP = 50;
  const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;

  let best = 0;
  try { best = +localStorage.getItem('brick-best') || 0; } catch (e) {}
  $('best').textContent = best;

  const paddle = { w: 100, h: 12, x: W / 2 - 50, y: H - 30, speed: 8 };
  const ball = { r: 7, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
  let bricks = [], particles = [];
  let score = 0, lives = 3, level = 1, state = 'menu'; // menu | play | pause | over
  const keys = {};

  function buildLevel(n) {
    bricks = [];
    const rows = Math.min(4 + n, 8);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        // 레벨이 오를수록 빈칸 패턴과 단단한 벽돌이 섞임
        if (n >= 2 && (r + c + n) % 7 === 0) continue;
        const hp = n >= 3 && r < Math.floor(n / 2) ? 2 : 1;
        bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), hp, color: COLORS[r % COLORS.length] });
      }
    }
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0; ball.vy = 0;
  }

  function launch() {
    if (!ball.stuck || state !== 'play') return;
    const speed = 5 + (level - 1) * 0.6;
    const ang = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(ang) * speed;
    ball.vy = Math.sin(ang) * speed;
    ball.stuck = false;
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    paddle.w = 100;
    buildLevel(level); resetBall();
    state = 'play'; overlay.classList.add('hidden');
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = lives;
    $('level').textContent = level;
    if (score > best) {
      best = score; $('best').textContent = best;
      try { localStorage.setItem('brick-best', best); } catch (e) {}
    }
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title; ovText.textContent = text; startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function burst(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({ x, y, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: 30, color });
    }
  }

  function update() {
    if (keys.ArrowLeft || keys.a) paddle.x -= paddle.speed;
    if (keys.ArrowRight || keys.d) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    } else {
      // 빠른 공이 벽돌을 뚫지 않도록 작은 단계로 나눠 이동
      const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) / 3);
      for (let s = 0; s < steps; s++) {
        if (stepBall(1 / steps)) break;
      }
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }

  // true를 반환하면 이번 프레임 이동 중단
  function stepBall(t) {
    ball.x += ball.vx * t;
    ball.y += ball.vy * t;

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    if (ball.y > H + ball.r) {
      lives--;
      updateHud();
      if (lives <= 0) {
        state = 'over';
        showOverlay('게임 오버', `점수: ${score}`, '다시 하기');
      } else resetBall();
      return true;
    }

    // 패들: 맞은 위치에 따라 반사 각도 결정
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const speed = Math.hypot(ball.vx, ball.vy);
      const ang = hit * (Math.PI / 3);
      ball.vx = Math.sin(ang) * speed;
      ball.vy = -Math.abs(Math.cos(ang) * speed);
      ball.y = paddle.y - ball.r;
    }

    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
      if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;

      b.hp--;
      if (b.hp <= 0) { score += 10 * level; burst(b.x + BW / 2, b.y + BH / 2, b.color); }
      else score += 5;
      updateHud();

      if (bricks.every(x => x.hp <= 0)) {
        level++;
        paddle.w = Math.max(60, 100 - (level - 1) * 8);
        buildLevel(level); resetBall();
        state = 'pause';
        showOverlay(`레벨 ${level - 1} 클리어!`, '다음 레벨로 진행합니다', '계속하기');
      }
      return true;
    }
    return false;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp === 2 ? 1 : 0.85;
      roundRect(b.x, b.y, BW, BH, 4); ctx.fill();
      if (b.hp === 2) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#5b8cff';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

    if (state === 'play' && ball.stuck) {
      ctx.fillStyle = '#8a93b8';
      ctx.font = '16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Space 또는 클릭/탭으로 발사', W / 2, H / 2 + 60);
    }
  }

  function loop() {
    if (state === 'play') update();
    draw();
    requestAnimationFrame(loop);
  }

  // 입력
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); if (state === 'play') launch(); }
    if (e.key === 'p' || e.key === 'P') {
      if (state === 'play') { state = 'pause'; showOverlay('일시정지', 'P를 눌러 계속', '계속하기'); }
      else if (state === 'pause') resume();
    }
    if (e.key === 'Enter' && state !== 'play') startBtn.click();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });

  function pointerX(clientX) {
    const rect = cv.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  cv.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    paddle.x = pointerX(e.clientX) - paddle.w / 2;
  });
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    paddle.x = pointerX(e.clientX) - paddle.w / 2;
    launch();
  });

  function resume() { state = 'play'; overlay.classList.add('hidden'); }
  startBtn.addEventListener('click', () => {
    if (state === 'menu' || state === 'over') newGame();
    else if (state === 'pause') resume();
  });

  buildLevel(1); resetBall();
  loop();
})();
</script>
</body>
</html>
